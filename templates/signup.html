<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
    <style>
        body { font-family: Arial; background:#f4f4f4; padding:30px; }
        .container { width:350px; margin:auto; background:#fff; padding:25px; border-radius:10px; box-shadow:0 0 10px #ccc; }
        h2 { text-align:center; }
        input, button {
            width:100%; padding:10px; margin:10px 0; border-radius:5px; border:1px solid #ccc;
        }
        button { background:#4CAF50; color:white; border:none; cursor:pointer; }
        button:hover { background:#45a049; }
        a { text-decoration:none; color:#4CAF50; font-size:14px; display:block; text-align:center; margin-top:10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Create Account</h2>

        <form action="/signup" method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">Create Account</button>
        </form>

        <a href="/login">Already have an account? Login</a>
    </div>
</body>
</html>
