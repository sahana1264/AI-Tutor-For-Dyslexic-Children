<!DOCTYPE html>
<html>
<head>
    <title>Home</title>

    <style>
        body {
            font-family: "Poppins", Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            margin: 0;
            padding: 0;
        }

        .container {
            margin-top: 100px;
            max-width: 450px;
            background: #ffffff;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            text-align: center;
            margin-left: auto;
            margin-right: auto;
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #333;
        }

        .progress-icon {
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, #4CAF50, #66bb6a);
            border-radius: 50%;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.25);
            font-size: 50px;
            transition: 0.3s ease;
        }

        .progress-icon:hover {
            transform: scale(1.15);
            box-shadow: 0 8px 18px rgba(0,0,0,0.35);
        }

        .btn {
            padding: 12px 22px;
            background: #0275d8;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            transition: 0.3s;
        }

        .btn:hover {
            background: #025aa5;
            transform: translateY(-2px);
        }

        .btn-red {
            background: #d9534f;
        }

        .btn-red:hover {
            background: #c9302c;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #565e64;
        }

        p {
            margin-top: 10px;
            color: #555;
            font-size: 14px;
        }
        
        a { text-decoration: none; }
    </style>
</head>

<body>

<div class="container">
    <h1>Welcome, {{ username }} 👋</h1>

    <!-- Progress Page -->
    <a href="/progress">
        <div class="progress-icon">📊</div>
    </a>

    <p>Tap the icon to see your learning progress</p>

    <!-- Start Task -->
    <form action="/index">
        <button class="btn" type="submit">Start Writing Task ✍️</button>
    </form>

   

    <!-- Logout -->
    <form action="/login" method="POST">
        <button class="btn btn-red" type="submit">🔑 Logout</button>
    </form>
</div>

</body>
</html>
